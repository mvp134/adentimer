<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리니지 보스 리젠 타이머</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif; background: #0f0f13; color: #e8e6f0; min-height: 100vh; }
#app { max-width: 1400px; margin: 0 auto; padding: 16px; --timeline-width: 776px; }

#header { display: flex; align-items: stretch; gap: 12px; margin-bottom: 14px; width: min(100%, var(--timeline-width)); }
#clock-box { display: flex; flex: 0 0 258px; flex-direction: column; justify-content: center; gap: 4px; padding: 14px 20px; background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; min-width: 0; }
#clock { font-size: 48px; font-weight: 600; color: #fff; letter-spacing: 3px; font-variant-numeric: tabular-nums; line-height: 1; }
#clock-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
#schedule-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.schedule-panel { flex: 1; min-width: 0; background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 10px; padding: 6px 12px; display: flex; align-items: center; gap: 14px; }
.panel-title { flex: 0 0 auto; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.schedule-weekday .panel-title { color: #4ade80; }
.schedule-weekend .panel-title { color: #60a5fa; }
.schedule-content { color: #d8d5e4; font-size: 12px; line-height: 1.35; white-space: nowrap; }

#legend { display: flex; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; }
.leg-dot.normal  { background: #4ade80; }
.leg-dot.always  { background: #60a5fa; }
.leg-dot.special { background: #fbbf24; }
.leg-dot.prob    { background: #f87171; }

/* 스크롤바 공통 */
.scrollbar-styled::-webkit-scrollbar { height: 12px; }
.scrollbar-styled::-webkit-scrollbar-track { background: #1a1a24; border-radius: 6px; }
.scrollbar-styled::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 6px; border: 2px solid #1a1a24; }
.scrollbar-styled::-webkit-scrollbar-thumb:hover { background: #6a6a9a; }

#scroll-top {
  overflow-x: auto; overflow-y: hidden;
  width: min(100%, var(--timeline-width));
  border-radius: 8px 8px 0 0;
  border: 1px solid #2a2a3a; border-bottom: none;
  scrollbar-width: auto; scrollbar-color: #4a4a6a #1a1a24;
}
#scroll-top-inner { height: 1px; }

#tbl-wrap {
  overflow-x: auto; overflow-y: visible;
  width: min(100%, var(--timeline-width));
  border-radius: 0 0 12px 12px;
  border: 1px solid #2a2a3a; border-top: none;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: auto; scrollbar-color: #4a4a6a #1a1a24;
  cursor: grab;
  user-select: none;
}
#tbl-wrap.dragging { cursor: grabbing; }

table { border-collapse: collapse; font-size: 11px; table-layout: fixed; width: max-content; }

/* 고정 열 너비 */
thead th.col-name, td.col-name { width: 150px; min-width: 150px; }
thead th.hr-col,   td.hr-col   { width: 26px;  min-width: 26px;  text-align: center; padding: 0; }

/* sticky 설정 - 보스명만 고정 */
thead th.col-name, td.col-name {
  text-align: left; padding-left: 12px;
  position: sticky; left: 0; z-index: 3;
  border-right: 1px solid #3a3a4a;
}
thead th {
  background: #1a1a24;
  border-bottom: 1px solid #2a2a3a;
  padding: 8px 4px;
  text-align: center; font-weight: 500;
  white-space: nowrap; color: #aaa;
  position: sticky; top: 0; z-index: 2;
}
thead th.col-name { z-index: 5; }

tbody tr { transition: background 0.1s; }
tbody tr:hover { background: #1e1e2a; }
tbody tr:hover td.col-name { background: #1e1e2a !important; }

td { padding: 5px 4px; text-align: center; border-bottom: 1px solid #1e1e28; vertical-align: middle; }
td.col-name { background: #0f0f13; font-weight: 500; white-space: nowrap; color: #e0ddf0; }

/* 현재 시간에 출현하는 보스 행 */
tbody tr.row-active td {
  background: #142a1c !important;
  border-top: 1px solid #28643e;
  border-bottom: 1px solid #28643e;
}
tbody tr.row-active td.col-name {
  background: #183622 !important;
  color: #bbf7d0;
  font-weight: 700;
  box-shadow: inset 4px 0 0 #4ade80;
}
tbody tr.row-active:hover td { background: #1b3a26 !important; }
tbody tr.row-active td.hl-now-active { background: #1a4d2a !important; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.dot.normal  { background: #4ade80; box-shadow: 0 0 5px #4ade8099; }
.dot.always  { background: #60a5fa; box-shadow: 0 0 5px #60a5fa99; }
.dot.special { background: #fbbf24; box-shadow: 0 0 5px #fbbf2499; }
.dot.prob    { background: #f87171; box-shadow: 0 0 5px #f8717199; }

thead th.hl-now  { background: #14532d !important; color: #bbf7d0 !important; border-bottom: 2px solid #4ade80 !important; }
td.hl-now        { background: #162412 !important; }
td.hl-now-active { background: #1a4d2a !important; }
td.hl-now-active .dot { transform: scale(1.4); }

@media (max-width: 700px) {
  #clock { font-size: 34px; }
  #header { flex-direction: column; }
  #clock-box { flex-basis: auto; }
  .schedule-panel { min-height: 42px; flex-wrap: wrap; gap: 4px 12px; }
  .schedule-content { white-space: normal; }
  thead th.col-name, td.col-name { width: 110px; min-width: 110px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="clock-box">
      <div id="clock">00:00:00</div>
      <div id="clock-label">KST 현재 시간</div>
    </div>
    <div id="schedule-stack">
      <div class="schedule-panel schedule-weekday">
        <div class="panel-title">📅 월·화·수·목·금</div>
        <div class="schedule-content">21시 15분 / 22시 15분 · 파멸 기란감옥 3층·4층 등장</div>
      </div>
      <div class="schedule-panel schedule-weekend">
        <div class="panel-title">📅 금·토·일 22시</div>
        <div class="schedule-content">샌드웜, 에르자베 등장</div>
      </div>
    </div>
  </div>

  <div id="legend">
    <div class="leg"><span class="leg-dot always"></span>매시간</div>
    <div class="leg"><span class="leg-dot normal"></span>일반 리젠</div>
    <div class="leg"><span class="leg-dot special"></span>특수/조건</div>
  </div>

  <div id="scroll-top" class="scrollbar-styled"><div id="scroll-top-inner"></div></div>
  <div id="tbl-wrap" class="scrollbar-styled"></div>
</div>

<script>
const HOURS = Array.from({length:24},(_,i)=>i);
const EVERY_HOURS = HOURS.filter(h=>h!==19);
const ODD_HOURS = [1,3,5,7,9,11,13,15,17,21,23];

const BOSSES = [
  // ── 일반 ──
  { name:"도펠겡어 보스", type:"normal", hours:[0,3,6,9,12,15,18] },
  { name:"산적두목", type:"normal", hours:[0,3,6,9,12,15,18] },
  { name:"흑기사 대장", type:"normal", hours:[0,3,6,9,12,15,18] },
  { name:"대흑장로", type:"normal", hours:[0,3,6,9,12,15,18] },
  { name:"네크로맨서", type:"normal", hours:[0,3,6,9,12,15,18] },
  { name:"아르피어", type:"normal", hours:[1,5,9,13,17] },
  { name:"커츠", type:"normal", hours:[1,5,9,13,17] },
  { name:"질풍의 샤스키", type:"normal", hours:[1,5,9,13,17] },
  { name:"광풍의 샤스키", type:"normal", hours:[1,5,9,13,17] },
  { name:"피닉스 / 이프리트", type:"normal", hours:[3,9,15] },
  { name:"데스나이트", type:"normal", hours:[3,9,15] },
  { name:"데몬", type:"normal", hours:[3,9,15] },
  { name:"에이션트 자이언트", type:"normal", hours:[3,9,15] },
  { name:"화염의 데스나이트", type:"normal", hours:[0] },
  { name:"간수장 타로스(퀘2)", type:"normal", hours:[3,9,15] },
  { name:"폭주한 클라인(파1)", type:"normal", hours:[3,9,15] },
  { name:"암흑영주 타로스(파2)", type:"normal", hours:[6,13] },
  // ── 특수/조건 ──
  { name:"수문장 고르고스(파3)", type:"special", hours:[21] },
  { name:"대부 텍투스(파4)", type:"special", hours:[22] },
  { name:"월드 보스", type:"special", hours:[8,14,20,21,22,23] },
  // ── 매시간 (19시 점검 제외) ──
  { name:"악마감시자", type:"always", group:"hourly", hours:EVERY_HOURS },
  { name:"거대 드레이크", type:"always", group:"hourly", hours:EVERY_HOURS },
  { name:"맘보토끼", type:"always", group:"hourly", hours:EVERY_HOURS },
  { name:"가스트로드", type:"always", group:"hourly", hours:EVERY_HOURS },
  // ── 홀수시간 (19시 점검 제외) ──
  { name:"정령감시자(무덤)", type:"normal", group:"odd", hours:ODD_HOURS },
  { name:"카스파 패밀리", type:"normal", group:"odd", hours:ODD_HOURS },
  { name:"큰발의 마요", type:"normal", group:"odd", hours:ODD_HOURS },
  { name:"네크로스 / 오르쿠스", type:"normal", group:"odd", hours:ODD_HOURS },
  { name:"숨겨진 오만 보스", type:"normal", group:"odd", hours:ODD_HOURS },
];

function getKST(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'})); }
function pad(n){ return String(n).padStart(2,'0'); }

function buildTable(focusH){
  let html='<table><thead><tr>'
    +'<th class="col-name">보스명</th>';
  for(let h=0;h<24;h++){
    let cls='hr-col';
    if(h===focusH) cls+=' hl-now';
    html+=`<th class="${cls}">${pad(h)}</th>`;
  }
  html+='</tr></thead><tbody>';
  const groupOrder={regular:0,hourly:1,odd:2};
  const sortedBosses=[...BOSSES].sort((a,b)=>{
    const aActive=a.hours.includes(focusH);
    const bActive=b.hours.includes(focusH);
    if(aActive!==bActive) return aActive?-1:1;
    return groupOrder[a.group||'regular']-groupOrder[b.group||'regular'];
  });
  for(const b of sortedBosses){
    const rowClass=b.hours.includes(focusH)?' class="row-active"':'';
    html+=`<tr${rowClass}>`
      +`<td class="col-name">${b.name}</td>`;
    for(let h=0;h<24;h++){
      const has=b.hours.includes(h);
      let cls='hr-col';
      if(h===focusH) cls+= has?' hl-now-active':' hl-now';
      html+=`<td class="${cls}">${has?`<span class="dot ${b.type}"></span>`:''}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  return html;
}

/* 드래그 스크롤 */
function initDragScroll(el){
  let isDown=false, startX=0, scrollStart=0;
  el.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    isDown=true;
    startX=e.pageX;
    scrollStart=el.scrollLeft;
    el.classList.add('dragging');
  });
  document.addEventListener('mousemove', e=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollLeft = scrollStart - (e.pageX - startX);
  });
  document.addEventListener('mouseup', ()=>{
    if(!isDown) return;
    isDown=false;
    el.classList.remove('dragging');
  });
  /* 터치 지원 */
  el.addEventListener('touchstart', e=>{ startX=e.touches[0].pageX; scrollStart=el.scrollLeft; }, {passive:true});
  el.addEventListener('touchmove',  e=>{ el.scrollLeft = scrollStart - (e.touches[0].pageX - startX); }, {passive:true});
}

/* 상단·하단 스크롤바 동기화 */
function syncScrollbars(){
  const top=document.getElementById('scroll-top');
  const bot=document.getElementById('tbl-wrap');
  let syncing=false;
  top.addEventListener('scroll',()=>{ if(syncing)return; syncing=true; bot.scrollLeft=top.scrollLeft; syncing=false; });
  bot.addEventListener('scroll',()=>{ if(syncing)return; syncing=true; top.scrollLeft=bot.scrollLeft; syncing=false; });
}

function updateTopScrollWidth(){
  const tbl=document.querySelector('#tbl-wrap table');
  const inner=document.getElementById('scroll-top-inner');
  if(tbl&&inner) inner.style.width=tbl.offsetWidth+'px';
}

/* 현재 시간 열을 뷰포트 중앙으로 */
function centerCurrentHour(){
  const wrap=document.getElementById('tbl-wrap');
  const hlTh=document.querySelector('thead th.hl-now');
  if(!hlTh) return;
  const stickyW = document.querySelector('thead th.col-name')?.offsetWidth || 150;
  const thLeft  = hlTh.offsetLeft;
  const thW     = hlTh.offsetWidth;
  const wrapW   = wrap.clientWidth;
  wrap.scrollLeft = thLeft - stickyW - (wrapW - stickyW) / 2 + thW / 2;
}

let lastFocusHour=-1;

function tick(){
  const kst=getKST();
  const h=kst.getHours(), m=kst.getMinutes(), s=kst.getSeconds();
  const focusH=m>=50?(h+1)%24:h;
  document.getElementById('clock').textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
  if(focusH!==lastFocusHour){
    lastFocusHour=focusH;
    document.getElementById('tbl-wrap').innerHTML=buildTable(focusH);
    requestAnimationFrame(()=>{
      updateTopScrollWidth();
      centerCurrentHour();
    });
  }
}

tick();
syncScrollbars();
initDragScroll(document.getElementById('tbl-wrap'));
setInterval(tick,1000);
window.addEventListener('resize', updateTopScrollWidth);
</script>
</body>
</html>
